name: Windows desktop release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v
        required: true
        type: string
      stable:
        description: Request a stable signed release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-packaging.txt

      - name: Resolve release gate
        id: gate
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Release version must be semantic.' }
          $stableRequested = ('${{ github.event_name }}' -eq 'push') -or ('${{ inputs.stable }}' -eq 'true')
          $hasBothCredentials = (-not [string]::IsNullOrWhiteSpace($env:CSC_LINK)) -and (-not [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD))
          $StableAllowed = $stableRequested -and $hasBothCredentials
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "stable=$($StableAllowed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "prerelease=$(((-not $StableAllowed)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install -r backend/requirements-packaging.txt
          npm --prefix frontend ci
          npm --prefix desktop ci

      - name: Set package version
        run: npm --prefix desktop version ${{ steps.gate.outputs.version }} --no-git-tag-version

      - name: Run full checks
        shell: pwsh
        run: ./scripts/run_checks.ps1

      - name: Run desktop CD-7 tests and audit
        shell: pwsh
        run: |
          npm --prefix desktop run test:cd7
          npm --prefix desktop audit --audit-level=high

      - name: Build NSIS and validate update metadata
        shell: pwsh
        run: |
          ./scripts/build_desktop.ps1 -Target nsis
          backend/.venv/Scripts/python.exe scripts/verify_release_manifest.py artifacts/desktop/electron/latest.yml artifacts/desktop/electron

      - name: Verify stable Authenticode signature
        if: steps.gate.outputs.stable == 'true'
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem artifacts/desktop/electron -File -Filter '*Setup*.exe'
            Get-Item artifacts/desktop/electron/win-unpacked/FuLuA.exe
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Authenticode signature is not Valid: $($file.Name)" }
          }

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $root = Resolve-Path artifacts/desktop/electron
          $files = @(
            Get-ChildItem $root -File -Filter '*Setup*.exe'
            Get-Item (Join-Path $root 'latest.yml')
            Get-ChildItem $root -File -Filter '*.blockmap'
          )
          $lines = foreach ($file in $files) { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant(), $file.Name }
          Set-Content -LiteralPath (Join-Path $root 'SHA256SUMS.txt') -Value $lines -Encoding ascii

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.gate.outputs.tag }}'
          $assets = @(
            (Get-ChildItem artifacts/desktop/electron -File -Filter '*Setup*.exe').FullName
            (Resolve-Path artifacts/desktop/electron/latest.yml).Path
            (Get-ChildItem artifacts/desktop/electron -File -Filter '*.blockmap').FullName
            (Resolve-Path artifacts/desktop/electron/SHA256SUMS.txt).Path
            (Resolve-Path 'docs/客户端发布检查表.md').Path
          )
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            $flags = @('--title', "附录A编写工具 $tag", '--notes-file', 'docs/客户端发布检查表.md')
            if ('${{ steps.gate.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
            gh release create $tag @assets @flags
          }
