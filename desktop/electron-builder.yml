appId: cn.fulua.appendix-a-tool
productName: 附录A编写工具
asar: true
electronUpdaterCompatibility: ">=2.16"

publish:
  provider: github
  owner: ZN4819
  repo: Open-FuLuA
  channel: latest
  releaseType: release

directories:
  output: ../artifacts/desktop/electron

files:
  - dist/**/*
  - "!dist/**/*.test.js"
  - "!dist/**/*.test.js.map"
  - "!dist/**/*.map"
  - "!node_modules/**/*.map"
  - package.json

extraResources:
  - from: ../frontend/dist
    to: frontend
  - from: ../artifacts/desktop/backend/fulua-backend
    to: backend

win:
  executableName: FuLuA
  target:
    - target: dir
      arch: x64
    - target: nsis
      arch: x64

nsis:
  artifactName: "fulua-desktop-setup-${version}.${ext}"
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 附录A编写工具
  uninstallDisplayName: 附录A编写工具
